<meta charset="utf-8">
<title>Rich Menu Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3F6F4;
    --surface:#FFFFFF;
    --surface-2:#EAF1ED;
    --ink:#15221C;
    --muted:#5B6B63;
    --line:#D7E0DA;
    --accent:#06C755;
    --accent-ink:#04331B;
    --accent-soft:#E1F8EA;
    --danger:#C8433D;
    --warn:#A8700A;
    --shadow: 0 1px 2px rgba(21,34,28,0.06), 0 8px 24px -12px rgba(21,34,28,0.18);
    --font-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1512;
      --surface:#141F19;
      --surface-2:#1A2620;
      --ink:#E7F1EC;
      --muted:#8CA79B;
      --line:#263229;
      --accent:#35DE7B;
      --accent-ink:#04140B;
      --accent-soft:#173226;
      --danger:#FF8880;
      --warn:#E8A63B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"]{
    --bg:#0D1512;
    --surface:#141F19;
    --surface-2:#1A2620;
    --ink:#E7F1EC;
    --muted:#8CA79B;
    --line:#263229;
    --accent:#35DE7B;
    --accent-ink:#04140B;
    --accent-soft:#173226;
    --danger:#FF8880;
    --warn:#E8A63B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  *:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .app{display:flex; flex-direction:column; min-height:100vh;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{font-size:28px; line-height:1;}
  .brand-text h1{font-size:18px; font-weight:700; letter-spacing:-0.01em;}
  .brand-text p{margin:2px 0 0; font-size:12.5px; color:var(--muted);}
  .topbar-actions{display:flex; align-items:center; gap:10px;}
  .field-inline{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .field-inline select{
    padding:7px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:13px;
  }

  /* ---------- tab bar (menus) ---------- */
  .tabbar-row{
    display:flex; align-items:center; gap:10px; padding:10px 24px;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .tabbar{display:flex; align-items:center; gap:8px; overflow-x:auto; flex:1;}
  .tab-chip{
    display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
    border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
    font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; color:var(--ink);
    flex-shrink:0;
  }
  .tab-chip.is-active{background:var(--accent-soft); border-color:var(--accent);}
  .tab-chip .tab-close{opacity:0.5; font-size:11px; line-height:1;}
  .tab-chip .tab-close:hover{opacity:1; color:var(--danger);}

  /* ---------- workspace grid ---------- */
  .workspace{
    display:grid; grid-template-columns:252px 1fr 288px; gap:16px;
    padding:18px 24px; flex:1; align-items:start;
  }
  @media (max-width: 980px){
    .workspace{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow);
  }

  /* ---------- toolbox ---------- */
  .toolbox{padding:16px; display:flex; flex-direction:column; gap:18px;}
  .tb-section h2{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); margin-bottom:10px;
  }
  .grid-presets{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .grid-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 6px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); cursor:pointer; font-size:11.5px;
  }
  .grid-btn:hover{border-color:var(--accent);}
  .grid-swatch{display:grid; gap:2px; width:34px; height:22px;}
  .grid-swatch span{background:var(--accent); opacity:0.55; border-radius:2px;}

  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .field label{font-size:12px; color:var(--muted); display:flex; justify-content:space-between;}
  .field input[type="text"],
  .field input[type="url"],
  .field textarea{
    padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:13px; width:100%;
  }
  .field input[type="color"]{
    width:100%; height:34px; padding:2px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); cursor:pointer;
  }
  .counter{font-variant-numeric:tabular-nums; font-family:var(--font-mono); font-size:11px;}
  .counter.warn{color:var(--warn);}
  .counter.danger{color:var(--danger);}

  .bg-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .btn{
    appearance:none; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.full{width:100%;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.04);}
  .btn.ghost{background:transparent;}
  .btn.danger-text{color:var(--danger); border-color:transparent; background:transparent; padding:4px 6px;}
  .btn[disabled]{opacity:0.45; cursor:not-allowed;}
  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type="file"]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }

  .areas-list{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .area-row{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:9px;
    border:1px solid var(--line); background:var(--surface-2); cursor:pointer; font-size:12.5px;
  }
  .area-row.is-active{border-color:var(--accent); background:var(--accent-soft);}
  .area-row .idx{font-family:var(--font-mono); color:var(--muted); width:16px; text-align:right;}
  .area-row .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pill{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 6px; border-radius:999px; white-space:nowrap;
  }
  .pill.type-message{background:#DCEBFF; color:#1D4E8F;}
  .pill.type-postback{background:#FBE6C6; color:#8A5B08;}
  .pill.type-uri{background:#F0DBFB; color:#6E2E92;}
  .pill.type-richmenuswitch{background:#DFF5E4; color:#146C36;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.type-message{background:#173654; color:#9CC4FF;} }
  :root[data-theme="dark"] .pill.type-message{background:#173654; color:#9CC4FF;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.type-postback{background:#4A3609; color:#F5CE84;} }
  :root[data-theme="dark"] .pill.type-postback{background:#4A3609; color:#F5CE84;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.type-uri{background:#3B1E4C; color:#E3B6FF;} }
  :root[data-theme="dark"] .pill.type-uri{background:#3B1E4C; color:#E3B6FF;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pill.type-richmenuswitch{background:#123A22; color:#7FE3A0;} }
  :root[data-theme="dark"] .pill.type-richmenuswitch{background:#123A22; color:#7FE3A0;}
  .empty-count{font-size:11.5px; color:var(--muted); margin-top:8px;}

  /* ---------- canvas ---------- */
  .canvas-wrap{
    padding:18px; display:flex; flex-direction:column; align-items:center; gap:10px;
    overflow-x:auto;
  }
  .canvas-meta{
    display:flex; justify-content:space-between; width:100%; max-width:900px;
    font-size:11.5px; color:var(--muted); font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  }
  .canvas-hint{font-size:11.5px; color:var(--muted); max-width:900px; width:100%;}
  #canvas{
    position:relative; border-radius:6px; border:1px solid var(--line);
    background-color:#0B3B21; background-size:cover; background-position:center;
    touch-action:none; cursor:crosshair; flex-shrink:0;
  }
  .area-box{
    position:absolute; border-radius:4px; border:1px solid rgba(255,255,255,0.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:grab; user-select:none; text-align:center; padding:4px; overflow:hidden;
  }
  .area-box.is-selected{outline:2px solid var(--accent); outline-offset:2px; z-index:2;}
  .area-box .area-icon{font-size:20px; line-height:1;}
  .area-box .area-label{font-size:11px; font-weight:600; line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .area-box .area-type-badge{
    position:absolute; top:3px; left:4px; font-size:8px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.02em; background:rgba(0,0,0,0.35); color:#fff; padding:1px 5px; border-radius:999px;
  }
  .resize-handle{
    position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px;
    background:var(--accent); border:2px solid var(--surface); border-radius:50%;
    cursor:nwse-resize; z-index:3;
  }

  /* ---------- inspector ---------- */
  .inspector{padding:16px; display:flex; flex-direction:column; gap:14px;}
  .inspector-empty{
    color:var(--muted); font-size:12.5px; line-height:1.6; padding:12px 4px;
  }
  .inspector-head{display:flex; justify-content:space-between; align-items:center;}
  .inspector-head h2{font-size:13px; font-weight:700;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .field input.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  /* ---------- footer / export ---------- */
  .exportbar{
    display:grid; grid-template-columns:1fr 260px; gap:16px;
    padding:16px 24px 24px;
  }
  @media (max-width: 980px){ .exportbar{grid-template-columns:1fr;} }
  .json-panel{padding:14px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .json-head{display:flex; justify-content:space-between; align-items:center;}
  .json-head span{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em;}
  .json-actions{display:flex; gap:6px;}
  pre#jsonPreview{
    margin:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:12px; font-family:var(--font-mono); font-size:11.5px; line-height:1.55;
    max-height:220px; overflow:auto; color:var(--ink);
  }
  .export-panel{padding:14px; display:flex; flex-direction:column; gap:10px; align-items:stretch;}
  .export-panel .hint{font-size:11.5px; color:var(--muted); line-height:1.5; margin:0;}
  .png-preview{display:none; flex-direction:column; gap:6px;}
  .png-preview.is-visible{display:flex;}
  .png-preview img{width:100%; border-radius:8px; border:1px solid var(--line);}
  .png-preview p{margin:0; font-size:11px; color:var(--muted);}

  /* ---------- toast ---------- */
  #toastHost{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
    font-size:12.5px; box-shadow:var(--shadow); opacity:0; transform:translateY(6px);
    animation:toast-in 0.18s ease-out forwards;
  }
  .toast.error{background:var(--danger); color:#fff;}
  @keyframes toast-in{ to{opacity:1; transform:translateY(0);} }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🍱</span>
      <div class="brand-text">
        <h1>Rich Menu Studio</h1>
        <p>LINEリッチメニューをデザインして、画像とAPI用JSONを書き出す</p>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="field-inline">
        サイズ
        <select id="sizePreset">
          <option value="full">Full — 2500×1686</option>
          <option value="compact">Compact — 2500×843</option>
        </select>
      </label>
    </div>
  </header>

  <div class="tabbar-row">
    <div class="tabbar" id="tabbar"></div>
    <button class="btn ghost" id="addMenuBtn" type="button">＋ タブを追加</button>
  </div>

  <div class="workspace">
    <aside class="toolbox panel">
      <div class="tb-section">
        <h2>グリッドから作成</h2>
        <div class="grid-presets" id="gridPresets"></div>
      </div>

      <div class="tb-section">
        <h2>背景</h2>
        <div class="bg-row">
          <div class="field" style="margin:0;">
            <label>塗り色</label>
            <input type="color" id="bgColor" value="#0B3B21">
          </div>
          <div class="field" style="margin:0;">
            <label>&nbsp;</label>
            <button class="btn file-btn full" type="button">画像を選ぶ
              <input type="file" id="bgImageInput" accept="image/*">
            </button>
          </div>
        </div>
        <button class="btn ghost full" id="clearBgImage" type="button" disabled>画像を削除</button>
      </div>

      <div class="tb-section">
        <h2>メニュー設定</h2>
        <div class="field">
          <label>内部名 (name)</label>
          <input type="text" id="menuName" maxlength="300" placeholder="例）メインメニュー">
        </div>
        <div class="field">
          <label>タブに出す文字 (chatBarText) <span class="counter" id="chatBarCounter">0/14</span></label>
          <input type="text" id="chatBarText" placeholder="例）メニュー">
        </div>
        <div class="field">
          <label>エイリアス (richMenuAliasId)</label>
          <input type="text" id="menuAlias" maxlength="32" placeholder="例）tab1">
        </div>
      </div>

      <div class="tb-section">
        <h2>エリア <span class="counter" id="areaCounter">0/20</span></h2>
        <button class="btn full" id="addAreaBtn" type="button">＋ 新規エリアを追加</button>
        <ul class="areas-list" id="areasList"></ul>
        <p class="empty-count" id="areasEmptyHint">キャンバス上をドラッグしてもエリアを作成できます。</p>
      </div>
    </aside>

    <main class="canvas-wrap panel">
      <div class="canvas-meta">
        <span id="canvasSizeLabel">実寸 2500×1686px</span>
        <span id="canvasScaleLabel">表示倍率 34%</span>
      </div>
      <div id="canvas"></div>
      <p class="canvas-hint">空いている場所をドラッグして新規エリアを作成、エリアをドラッグで移動、右下の丸をドラッグでリサイズできます。</p>
    </main>

    <aside class="inspector panel" id="inspector"></aside>
  </div>

  <div class="exportbar">
    <section class="json-panel panel">
      <div class="json-head">
        <span>richmenu.json プレビュー</span>
        <div class="json-actions">
          <button class="btn ghost" id="copyJsonBtn" type="button">コピー</button>
          <button class="btn ghost" id="downloadJsonBtn" type="button">ダウンロード</button>
        </div>
      </div>
      <pre id="jsonPreview"><code></code></pre>
    </section>

    <section class="export-panel panel">
      <button class="btn primary full" id="exportPngBtn" type="button">PNGを書き出す</button>
      <p class="hint" id="exportHint">Messaging API の Rich Menu 作成エンドポイントにそのまま渡せる形式で書き出します。</p>
      <div class="png-preview" id="pngPreview">
        <img id="pngPreviewImg" alt="書き出したリッチメニュー画像のプレビュー">
        <p id="pngPreviewHint"></p>
      </div>
    </section>
  </div>
</div>

<div id="toastHost"></div>

<script>
(function(){
  "use strict";

  var MIN_SIZE = 24;
  var DISPLAY_WIDTH = 860;
  var MAX_AREAS = 20;
  var SIZES = {
    full: { width: 2500, height: 1686, label: "Full — 2500×1686" },
    compact: { width: 2500, height: 843, label: "Compact — 2500×843" }
  };

  var idCounter = 1;
  function uid(){ return "id" + (idCounter++); }

  var state = {
    activeMenuIndex: 0,
    menus: [
      {
        id: uid(),
        alias: "tab1",
        size: "full",
        width: SIZES.full.width,
        height: SIZES.full.height,
        name: "メインメニュー",
        chatBarText: "メニュー",
        bgColor: "#0B3B21",
        bgImage: null,
        areas: [],
        selectedId: null
      }
    ]
  };

  var dragState = null;
  var downloadsApi = null;

  function activeMenu(){ return state.menus[state.activeMenuIndex]; }

  // ---------- element refs ----------
  var el = {
    sizePreset: document.getElementById("sizePreset"),
    tabbar: document.getElementById("tabbar"),
    addMenuBtn: document.getElementById("addMenuBtn"),
    canvas: document.getElementById("canvas"),
    canvasSizeLabel: document.getElementById("canvasSizeLabel"),
    gridPresets: document.getElementById("gridPresets"),
    bgColor: document.getElementById("bgColor"),
    bgImageInput: document.getElementById("bgImageInput"),
    clearBgImage: document.getElementById("clearBgImage"),
    menuName: document.getElementById("menuName"),
    menuAlias: document.getElementById("menuAlias"),
    chatBarText: document.getElementById("chatBarText"),
    chatBarCounter: document.getElementById("chatBarCounter"),
    areaCounter: document.getElementById("areaCounter"),
    addAreaBtn: document.getElementById("addAreaBtn"),
    areasList: document.getElementById("areasList"),
    areasEmptyHint: document.getElementById("areasEmptyHint"),
    inspector: document.getElementById("inspector"),
    jsonPreview: document.querySelector("#jsonPreview code"),
    copyJsonBtn: document.getElementById("copyJsonBtn"),
    downloadJsonBtn: document.getElementById("downloadJsonBtn"),
    exportPngBtn: document.getElementById("exportPngBtn"),
    pngPreview: document.getElementById("pngPreview"),
    pngPreviewImg: document.getElementById("pngPreviewImg"),
    pngPreviewHint: document.getElementById("pngPreviewHint"),
    toastHost: document.getElementById("toastHost")
  };

  function scale(){ return DISPLAY_WIDTH / activeMenu().width; }
  function clampNum(v, min, max){ return Math.min(Math.max(v, min), max); }
  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function fontWeightCss(w){
    if (w === "regular") return 500;
    if (w === "semibold") return 600;
    if (w === "extrabold") return 800;
    return 700;
  }

  function findArea(id){
    var areas = activeMenu().areas;
    for (var i = 0; i < areas.length; i += 1) {
      if (areas[i].id === id) return areas[i];
    }
    return null;
  }

  function actionTypeLabel(type){
    if (type === "postback") return "Postback";
    if (type === "uri") return "URI";
    if (type === "richmenuswitch") return "Switch";
    return "Message";
  }

  function showToast(message, tone){
    var toast = document.createElement("div");
    toast.className = "toast" + (tone === "error" ? " error" : "");
    toast.textContent = message;
    el.toastHost.appendChild(toast);
    setTimeout(function(){
      toast.style.transition = "opacity 0.2s ease";
      toast.style.opacity = "0";
      setTimeout(function(){ toast.remove(); }, 220);
    }, 2600);
  }

  function downloadErrorMessage(err){
    var code = err && err.code;
    switch (code) {
      case "declined": return "保存がキャンセルされました";
      case "rate_limited": return "少し時間をおいてから、もう一度お試しください";
      case "too_large": return "ファイルサイズが大きすぎます(16MB上限)";
      case "rejected_extension":
      case "extension_not_enabled": return "この形式のファイルは保存できません";
      default: return "保存に失敗しました: " + (err && err.message ? err.message : String(err));
    }
  }

  // ---------- default factories ----------
  function createDefaultArea(x, y, w, h){
    var n = activeMenu().areas.length + 1;
    return {
      id: uid(),
      x: x, y: y, w: w, h: h,
      label: "エリア" + n,
      icon: "",
      image: null,
      bgColor: "#1B7A43",
      textColor: "#FFFFFF",
      transparent: false,
      radius: 16,
      border: "line",
      fontWeight: "bold",
      fontSize: null,
      textShadow: false,
      actionType: "message",
      actionValue: "エリア" + n,
      targetMenuId: null
    };
  }

  function addManualArea(){
    var menu = activeMenu();
    if (menu.areas.length >= MAX_AREAS) {
      showToast("エリアは最大 " + MAX_AREAS + " 個までです", "error");
      return;
    }
    var w = Math.min(400, menu.width);
    var h = Math.min(400, menu.height);
    var x = clampNum((menu.width - w) / 2, 0, menu.width - w);
    var y = clampNum((menu.height - h) / 2, 0, menu.height - h);
    var area = createDefaultArea(x, y, w, h);
    menu.areas.push(area);
    menu.selectedId = area.id;
    render();
  }

  function generateGrid(rows, cols){
    var menu = activeMenu();
    var count = rows * cols;
    if (count > MAX_AREAS) {
      showToast("エリアは最大 " + MAX_AREAS + " 個までです", "error");
      return;
    }
    var cellW = Math.floor(menu.width / cols);
    var cellH = Math.floor(menu.height / rows);
    var areas = [];
    var n = 1;
    for (var r = 0; r < rows; r += 1) {
      for (var c = 0; c < cols; c += 1) {
        areas.push({
          id: uid(),
          x: c * cellW,
          y: r * cellH,
          w: cellW,
          h: cellH,
          label: "エリア" + n,
          icon: "",
          image: null,
          bgColor: n % 2 === 0 ? "#0F5C33" : "#1B7A43",
          textColor: "#FFFFFF",
          transparent: false,
          radius: 16,
          border: "line",
          fontWeight: "bold",
          fontSize: null,
          textShadow: false,
          actionType: "message",
          actionValue: "エリア" + n,
          targetMenuId: null
        });
        n += 1;
      }
    }
    menu.areas = areas;
    menu.selectedId = null;
    render();
    showToast(rows + "×" + cols + " のグリッドを作成しました");
  }

  function deleteArea(id){
    var menu = activeMenu();
    menu.areas = menu.areas.filter(function(a){ return a.id !== id; });
    if (menu.selectedId === id) menu.selectedId = null;
    render();
  }

  // ---------- menus (tabs) ----------
  function createDefaultMenu(){
    var n = state.menus.length + 1;
    return {
      id: uid(),
      alias: "tab" + n,
      size: "full",
      width: SIZES.full.width,
      height: SIZES.full.height,
      name: "メニュー" + n,
      chatBarText: "メニュー" + n,
      bgColor: "#0B3B21",
      bgImage: null,
      areas: [],
      selectedId: null
    };
  }

  function addMenu(){
    var menu = createDefaultMenu();
    state.menus.push(menu);
    state.activeMenuIndex = state.menus.length - 1;
    render();
    showToast("タブを追加しました");
  }

  function switchMenu(index){
    state.activeMenuIndex = clampNum(index, 0, state.menus.length - 1);
    render();
  }

  function deleteMenu(id){
    if (state.menus.length <= 1) {
      showToast("最後のタブは削除できません", "error");
      return;
    }
    var idx = -1;
    for (var i = 0; i < state.menus.length; i += 1) {
      if (state.menus[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;

    state.menus.splice(idx, 1);
    state.menus.forEach(function(m){
      m.areas.forEach(function(a){
        if (a.actionType === "richmenuswitch" && a.targetMenuId === id) {
          a.targetMenuId = null;
        }
      });
    });
    if (state.activeMenuIndex >= state.menus.length) {
      state.activeMenuIndex = state.menus.length - 1;
    }
    render();
  }

  // ---------- size preset ----------
  function applySizePreset(key){
    var preset = SIZES[key];
    var menu = activeMenu();
    menu.size = key;
    menu.width = preset.width;
    menu.height = preset.height;
    menu.areas = [];
    menu.selectedId = null;
    render();
  }

  // ---------- pointer interactions ----------
  function canvasPointToReal(e){
    var menu = activeMenu();
    var rect = el.canvas.getBoundingClientRect();
    return {
      x: clampNum((e.clientX - rect.left) / scale(), 0, menu.width),
      y: clampNum((e.clientY - rect.top) / scale(), 0, menu.height)
    };
  }

  function onCanvasPointerDown(e){
    if (e.target.closest('[data-role="area"]') || e.target.closest('[data-role="handle"]')) return;
    var menu = activeMenu();
    if (menu.areas.length >= MAX_AREAS) {
      showToast("エリアは最大 " + MAX_AREAS + " 個までです", "error");
      return;
    }
    var p = canvasPointToReal(e);
    var area = createDefaultArea(p.x, p.y, 0, 0);
    menu.areas.push(area);
    menu.selectedId = area.id;
    dragState = { mode: "create", id: area.id, originX: p.x, originY: p.y };
    el.canvas.setPointerCapture(e.pointerId);
    render();
  }

  function onAreaPointerDown(e){
    e.stopPropagation();
    var id = e.currentTarget.dataset.id;
    var area = findArea(id);
    if (!area) return;
    activeMenu().selectedId = id;
    var p = canvasPointToReal(e);
    dragState = {
      mode: "move", id: id, startX: p.x, startY: p.y,
      startAreaX: area.x, startAreaY: area.y
    };
    el.canvas.setPointerCapture(e.pointerId);
    render();
  }

  function onHandlePointerDown(e){
    e.stopPropagation();
    var id = e.currentTarget.dataset.id;
    activeMenu().selectedId = id;
    dragState = { mode: "resize", id: id };
    el.canvas.setPointerCapture(e.pointerId);
    render();
  }

  function onCanvasPointerMove(e){
    if (!dragState) return;
    var menu = activeMenu();
    var area = findArea(dragState.id);
    if (!area) return;
    var p = canvasPointToReal(e);

    if (dragState.mode === "create") {
      area.x = Math.min(dragState.originX, p.x);
      area.y = Math.min(dragState.originY, p.y);
      area.w = Math.abs(p.x - dragState.originX);
      area.h = Math.abs(p.y - dragState.originY);
    } else if (dragState.mode === "move") {
      area.x = clampNum(dragState.startAreaX + (p.x - dragState.startX), 0, menu.width - area.w);
      area.y = clampNum(dragState.startAreaY + (p.y - dragState.startY), 0, menu.height - area.h);
    } else if (dragState.mode === "resize") {
      area.w = clampNum(p.x - area.x, MIN_SIZE, menu.width - area.x);
      area.h = clampNum(p.y - area.y, MIN_SIZE, menu.height - area.y);
    }
    render();
  }

  function onCanvasPointerUp(){
    if (!dragState) return;
    var menu = activeMenu();
    var area = findArea(dragState.id);
    if (area && dragState.mode === "create" && (area.w < MIN_SIZE || area.h < MIN_SIZE)) {
      area.w = Math.min(300, menu.width);
      area.h = Math.min(300, menu.height);
      area.x = clampNum(area.x, 0, menu.width - area.w);
      area.y = clampNum(area.y, 0, menu.height - area.h);
    }
    dragState = null;
    render();
  }

  document.addEventListener("keydown", function(e){
    if (e.key !== "Delete" && e.key !== "Backspace") return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    var menu = activeMenu();
    if (menu.selectedId) {
      e.preventDefault();
      deleteArea(menu.selectedId);
    }
  });

  // ---------- image helpers ----------
  function readImageAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- render ----------
  function render(){
    renderTopbar();
    renderTabs();
    renderToolbox();
    renderCanvas();
    renderInspector();
    renderJsonPreview();
  }

  function renderTopbar(){
    el.sizePreset.value = activeMenu().size;
  }

  function renderTabs(){
    el.tabbar.innerHTML = "";
    state.menus.forEach(function(menu, index){
      var chip = document.createElement("div");
      chip.className = "tab-chip" + (index === state.activeMenuIndex ? " is-active" : "");
      chip.innerHTML =
        '<span class="tab-label">' + escapeHtml(menu.name || ("メニュー" + (index + 1))) + '</span>' +
        (state.menus.length > 1 ? '<span class="tab-close" data-close="' + menu.id + '" title="このタブを削除">✕</span>' : "");
      chip.addEventListener("click", function(e){
        if (e.target.closest("[data-close]")) return;
        switchMenu(index);
      });
      var closeBtn = chip.querySelector("[data-close]");
      if (closeBtn) {
        closeBtn.addEventListener("click", function(e){
          e.stopPropagation();
          deleteMenu(menu.id);
        });
      }
      el.tabbar.appendChild(chip);
    });
  }

  function renderToolbox(){
    var menu = activeMenu();
    el.bgColor.value = menu.bgColor;
    el.clearBgImage.disabled = !menu.bgImage;
    el.menuName.value = menu.name;
    el.menuAlias.value = menu.alias;
    el.chatBarText.value = menu.chatBarText;

    var chatLen = menu.chatBarText.length;
    el.chatBarCounter.textContent = chatLen + "/14";
    el.chatBarCounter.className = "counter" + (chatLen > 14 ? " danger" : chatLen > 10 ? " warn" : "");

    el.areaCounter.textContent = menu.areas.length + "/" + MAX_AREAS;
    el.addAreaBtn.disabled = menu.areas.length >= MAX_AREAS;
    el.areasEmptyHint.style.display = menu.areas.length === 0 ? "block" : "none";

    el.areasList.innerHTML = "";
    menu.areas.forEach(function(area, index){
      var li = document.createElement("li");
      li.className = "area-row" + (area.id === menu.selectedId ? " is-active" : "");
      li.innerHTML =
        '<span class="idx">' + (index + 1) + '</span>' +
        '<span class="lbl">' + (area.icon ? escapeHtml(area.icon) + " " : "") + escapeHtml(area.label || "(無題)") + '</span>' +
        '<span class="pill type-' + area.actionType + '">' + actionTypeLabel(area.actionType) + '</span>' +
        '<button class="btn danger-text" type="button" title="削除" data-del="' + area.id + '">✕</button>';
      li.addEventListener("click", function(e){
        if (e.target.closest("[data-del]")) return;
        menu.selectedId = area.id;
        render();
      });
      li.querySelector("[data-del]").addEventListener("click", function(e){
        e.stopPropagation();
        deleteArea(area.id);
      });
      el.areasList.appendChild(li);
    });
  }

  function renderCanvas(){
    var menu = activeMenu();
    var s = scale();
    el.canvas.style.width = Math.round(menu.width * s) + "px";
    el.canvas.style.height = Math.round(menu.height * s) + "px";
    el.canvas.style.backgroundImage = menu.bgImage ? "url(" + menu.bgImage + ")" : "none";
    el.canvas.style.backgroundColor = menu.bgImage ? "transparent" : menu.bgColor;
    el.canvasSizeLabel.textContent = "実寸 " + menu.width + "×" + menu.height + "px";

    el.canvas.innerHTML = "";
    menu.areas.forEach(function(area){
      var box = document.createElement("div");
      box.className = "area-box" + (area.id === menu.selectedId ? " is-selected" : "");
      box.dataset.role = "area";
      box.dataset.id = area.id;
      box.style.left = Math.round(area.x * s) + "px";
      box.style.top = Math.round(area.y * s) + "px";
      box.style.width = Math.round(area.w * s) + "px";
      box.style.height = Math.round(area.h * s) + "px";
      box.style.backgroundImage = area.image ? "url(" + area.image + ")" : "none";
      box.style.backgroundSize = "cover";
      box.style.backgroundPosition = "center";
      box.style.backgroundColor = area.image ? "transparent" : (area.transparent ? "transparent" : area.bgColor);
      box.style.color = area.textColor;
      box.style.borderRadius = Math.round((area.radius || 0) * s) + "px";

      if (area.border === "shadow") {
        box.style.border = "none";
        box.style.boxShadow = "0 " + Math.round(18 * s) + "px " + Math.round(48 * s) + "px rgba(0,0,0,0.35)";
      } else if (area.border === "line") {
        box.style.border = "2px solid " + (area.transparent || area.image ? area.bgColor : "rgba(255,255,255,0.35)");
        box.style.boxShadow = "none";
      } else {
        box.style.border = "none";
        box.style.boxShadow = "none";
      }

      var labelFontSize = area.fontSize ? Math.round(area.fontSize * s) : null;
      var textShadowCss = area.textShadow ? "text-shadow:0 1px 3px rgba(0,0,0,0.65),0 0 8px rgba(0,0,0,0.35);" : "";
      var labelStyle = "font-weight:" + fontWeightCss(area.fontWeight) + ";" + textShadowCss + (labelFontSize ? ("font-size:" + labelFontSize + "px;") : "");
      var iconStyle = textShadowCss + (labelFontSize ? ("font-size:" + Math.round(labelFontSize * 1.6) + "px;") : "");

      box.innerHTML =
        '<span class="area-type-badge">' + actionTypeLabel(area.actionType) + '</span>' +
        (area.icon ? '<span class="area-icon" style="' + iconStyle + '">' + escapeHtml(area.icon) + '</span>' : "") +
        '<span class="area-label" style="' + labelStyle + '">' + escapeHtml(area.label || "") + '</span>';
      box.addEventListener("pointerdown", onAreaPointerDown);
      el.canvas.appendChild(box);

      if (area.id === menu.selectedId) {
        var handle = document.createElement("div");
        handle.className = "resize-handle";
        handle.dataset.role = "handle";
        handle.dataset.id = area.id;
        handle.style.left = Math.round((area.x + area.w) * s) + "px";
        handle.style.top = Math.round((area.y + area.h) * s) + "px";
        handle.addEventListener("pointerdown", onHandlePointerDown);
        el.canvas.appendChild(handle);
      }
    });
  }

  function renderInspector(){
    var menu = activeMenu();
    var area = menu.selectedId ? findArea(menu.selectedId) : null;
    if (!area) {
      el.inspector.innerHTML = '<p class="inspector-empty">エリアを選択すると、ラベル・色・タップ時のアクションを編集できます。<br><br>キャンバス上の空いている場所をドラッグすると新しいエリアを作成できます。</p>';
      return;
    }

    var isSwitch = area.actionType === "richmenuswitch";
    var actionValueLabel = area.actionType === "uri" ? "リンク先 URL" :
      area.actionType === "postback" ? "postback data" : "送信するテキスト";
    var actionValueType = area.actionType === "uri" ? "url" : "text";

    var actionFieldsHtml;
    if (isSwitch) {
      var otherMenus = state.menus.filter(function(m){ return m.id !== menu.id; });
      var optionsHtml = otherMenus.length
        ? otherMenus.map(function(m){
            return '<option value="' + m.id + '"' + (m.id === area.targetMenuId ? " selected" : "") + '>' + escapeHtml(m.name || "無題") + '</option>';
          }).join("")
        : '<option value="">(他にタブがありません)</option>';
      actionFieldsHtml =
        '<div class="field"><label>切り替え先タブ</label><select id="fArea_target"' + (otherMenus.length ? "" : " disabled") + '>' + optionsHtml + '</select></div>' +
        '<div class="field"><label>data(任意・受信側での判定用)</label><input type="text" id="fArea_value" value="' + escapeHtml(area.actionValue) + '"></div>';
    } else {
      actionFieldsHtml =
        '<div class="field"><label>' + actionValueLabel + '</label><input type="' + actionValueType + '" id="fArea_value" value="' + escapeHtml(area.actionValue) + '"></div>';
    }

    el.inspector.innerHTML =
      '<div class="inspector-head"><h2>エリア設定</h2><button class="btn danger-text" id="deleteAreaBtn" type="button">🗑 削除</button></div>' +
      '<div class="field"><label>ラベル</label><input type="text" id="fArea_label" value="' + escapeHtml(area.label) + '"></div>' +
      '<div class="field"><label>アイコン(絵文字)</label><input type="text" id="fArea_icon" value="' + escapeHtml(area.icon) + '" placeholder="任意"></div>' +

      '<div class="field"><label>背景画像</label>' +
      '<div class="bg-row" style="margin:0;">' +
      '<button class="btn file-btn full" type="button">画像を選ぶ<input type="file" id="fArea_imageInput" accept="image/*"></button>' +
      '<button class="btn ghost full" id="fArea_imageClear" type="button"' + (area.image ? "" : " disabled") + '>削除</button>' +
      '</div></div>' +

      '<div class="grid2">' +
      '<div class="field"><label>背景色</label><input type="color" id="fArea_bg" value="' + area.bgColor + '"' + (area.image ? " disabled" : "") + '></div>' +
      '<div class="field"><label>文字色</label><input type="color" id="fArea_fg" value="' + area.textColor + '"></div>' +
      '</div>' +

      '<div class="field"><label>背景を透明にする<input type="checkbox" id="fArea_transparent"' + (area.transparent ? " checked" : "") + (area.image ? " disabled" : "") + '></label></div>' +

      '<div class="grid2">' +
      '<div class="field"><label>枠のスタイル</label><select id="fArea_border">' +
      '<option value="line"' + (area.border === "line" ? " selected" : "") + '>ライン</option>' +
      '<option value="shadow"' + (area.border === "shadow" ? " selected" : "") + '>シャドウ</option>' +
      '<option value="none"' + (area.border === "none" ? " selected" : "") + '>なし</option>' +
      '</select></div>' +
      '<div class="field"><label>角丸</label><input class="mono" type="text" inputmode="numeric" id="fArea_radius" value="' + Math.round(area.radius || 0) + '"></div>' +
      '</div>' +

      '<div class="grid2">' +
      '<div class="field"><label>文字の太さ</label><select id="fArea_weight">' +
      '<option value="regular"' + (area.fontWeight === "regular" ? " selected" : "") + '>標準</option>' +
      '<option value="semibold"' + (area.fontWeight === "semibold" ? " selected" : "") + '>やや太字</option>' +
      '<option value="bold"' + (area.fontWeight === "bold" ? " selected" : "") + '>太字</option>' +
      '<option value="extrabold"' + (area.fontWeight === "extrabold" ? " selected" : "") + '>極太</option>' +
      '</select></div>' +
      '<div class="field"><label>文字サイズ</label><input class="mono" type="text" inputmode="numeric" id="fArea_fontSize" value="' + (area.fontSize ? Math.round(area.fontSize) : "") + '" placeholder="自動"></div>' +
      '</div>' +

      '<div class="field"><label>文字に縁取り/影を付ける<input type="checkbox" id="fArea_textShadow"' + (area.textShadow ? " checked" : "") + '></label></div>' +

      '<div class="field"><label>アクション種別</label><select id="fArea_type">' +
      '<option value="message"' + (area.actionType === "message" ? " selected" : "") + '>message(発言する)</option>' +
      '<option value="postback"' + (area.actionType === "postback" ? " selected" : "") + '>postback(裏でデータ送信)</option>' +
      '<option value="uri"' + (area.actionType === "uri" ? " selected" : "") + '>uri(リンクを開く)</option>' +
      '<option value="richmenuswitch"' + (isSwitch ? " selected" : "") + '>richmenuswitch(タブ切り替え)</option>' +
      '</select></div>' +
      actionFieldsHtml +

      '<div class="grid2">' +
      '<div class="field"><label>X</label><input class="mono" type="text" inputmode="numeric" id="fArea_x" value="' + Math.round(area.x) + '"></div>' +
      '<div class="field"><label>Y</label><input class="mono" type="text" inputmode="numeric" id="fArea_y" value="' + Math.round(area.y) + '"></div>' +
      '<div class="field"><label>幅</label><input class="mono" type="text" inputmode="numeric" id="fArea_w" value="' + Math.round(area.w) + '"></div>' +
      '<div class="field"><label>高さ</label><input class="mono" type="text" inputmode="numeric" id="fArea_h" value="' + Math.round(area.h) + '"></div>' +
      '</div>';

    document.getElementById("deleteAreaBtn").addEventListener("click", function(){ deleteArea(area.id); });
    bindText("fArea_label", function(v){ area.label = v; });
    bindText("fArea_icon", function(v){ area.icon = v; });
    bindText("fArea_value", function(v){ area.actionValue = v; });

    document.getElementById("fArea_imageInput").addEventListener("change", async function(){
      var file = this.files && this.files[0];
      if (!file) return;
      area.image = await readImageAsDataUrl(file);
      render();
    });
    document.getElementById("fArea_imageClear").addEventListener("click", function(){
      area.image = null;
      render();
    });

    document.getElementById("fArea_bg").addEventListener("input", function(){ area.bgColor = this.value; renderCanvas(); });
    document.getElementById("fArea_fg").addEventListener("input", function(){ area.textColor = this.value; renderCanvas(); });
    document.getElementById("fArea_transparent").addEventListener("change", function(){
      area.transparent = this.checked;
      if (area.transparent && !area._shadowAutoSet) {
        area.textShadow = true;
        area._shadowAutoSet = true;
      }
      render();
    });
    document.getElementById("fArea_border").addEventListener("change", function(){ area.border = this.value; renderCanvas(); });
    bindNumber("fArea_radius", function(v){ area.radius = clampNum(v, 0, 200); });
    document.getElementById("fArea_weight").addEventListener("change", function(){ area.fontWeight = this.value; renderCanvas(); });
    document.getElementById("fArea_fontSize").addEventListener("change", function(){
      var raw = this.value.trim();
      area.fontSize = raw === "" ? null : clampNum(parseInt(raw, 10) || 0, 8, 400);
      renderCanvas();
    });
    document.getElementById("fArea_textShadow").addEventListener("change", function(){ area.textShadow = this.checked; renderCanvas(); });

    document.getElementById("fArea_type").addEventListener("change", function(){ area.actionType = this.value; render(); });
    var targetSelect = document.getElementById("fArea_target");
    if (targetSelect) {
      targetSelect.addEventListener("change", function(){ area.targetMenuId = this.value || null; renderJsonPreview(); });
    }

    bindNumber("fArea_x", function(v){ area.x = clampNum(v, 0, activeMenu().width - area.w); });
    bindNumber("fArea_y", function(v){ area.y = clampNum(v, 0, activeMenu().height - area.h); });
    bindNumber("fArea_w", function(v){ area.w = clampNum(v, MIN_SIZE, activeMenu().width - area.x); });
    bindNumber("fArea_h", function(v){ area.h = clampNum(v, MIN_SIZE, activeMenu().height - area.y); });
  }

  function bindText(id, apply){
    var input = document.getElementById(id);
    input.addEventListener("input", function(){
      apply(this.value);
      renderCanvas();
      renderToolbox();
      renderJsonPreview();
    });
  }

  function bindNumber(id, apply){
    var input = document.getElementById(id);
    input.addEventListener("change", function(){
      var v = parseInt(this.value, 10);
      if (isNaN(v)) v = 0;
      apply(v);
      render();
    });
  }

  function buildRichMenuObject(menu){
    var m = menu || activeMenu();
    return {
      size: { width: m.width, height: m.height },
      selected: false,
      name: m.name || "richmenu",
      chatBarText: (m.chatBarText || "メニュー").slice(0, 14),
      areas: m.areas.map(function(a){
        return {
          bounds: { x: Math.round(a.x), y: Math.round(a.y), width: Math.round(a.w), height: Math.round(a.h) },
          action: buildAction(a)
        };
      })
    };
  }

  function buildAction(a){
    if (a.actionType === "postback") {
      return { type: "postback", data: a.actionValue || "", displayText: a.label || undefined };
    }
    if (a.actionType === "uri") {
      return { type: "uri", uri: a.actionValue || "https://" };
    }
    if (a.actionType === "richmenuswitch") {
      var targetMenu = null;
      for (var i = 0; i < state.menus.length; i += 1) {
        if (state.menus[i].id === a.targetMenuId) { targetMenu = state.menus[i]; break; }
      }
      return {
        type: "richmenuswitch",
        richMenuAliasId: targetMenu ? (targetMenu.alias || targetMenu.id) : "",
        data: a.actionValue || ""
      };
    }
    return { type: "message", text: a.actionValue || a.label || "" };
  }

  function renderJsonPreview(){
    el.jsonPreview.textContent = JSON.stringify(buildRichMenuObject(activeMenu()), null, 2);
  }

  // ---------- clipboard ----------
  function selectPreformattedText(node){
    var range = document.createRange();
    range.selectNodeContents(node);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  async function copyJsonToClipboard(){
    var text = JSON.stringify(buildRichMenuObject(activeMenu()), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      showToast("JSON をコピーしました");
    } catch (err) {
      selectPreformattedText(document.getElementById("jsonPreview"));
      showToast("自動コピーできないため、テキストを選択状態にしました(⌘/Ctrl+Cでコピー)");
    }
  }

  // ---------- export: json ----------
  async function downloadJson(){
    var menu = activeMenu();
    var text = JSON.stringify(buildRichMenuObject(menu), null, 2);
    if (downloadsApi) {
      try {
        await downloadsApi.save({ filename: sanitizeFilename(menu.name) + ".json", data: text });
        showToast("richmenu.json を保存しました");
      } catch (err) {
        showToast(downloadErrorMessage(err), "error");
      }
    } else if (triggerBrowserDownload(sanitizeFilename(menu.name) + ".json", text, "application/json")) {
      showToast("richmenu.json をダウンロードしました");
    } else {
      selectPreformattedText(document.getElementById("jsonPreview"));
      showToast("この環境では自動保存できないため、コピー用に選択状態にしました");
    }
  }

  function sanitizeFilename(name){
    var cleaned = String(name || "richmenu").trim().replace(/[\\/:*?"<>|]+/g, "_");
    return cleaned || "richmenu";
  }

  /**
   * Claude Artifact のサンドボックス外(GitHub Pages など通常のブラウザ)で
   * 動いている場合向けの素朴なダウンロード手段。
   * サンドボックス内ではクリックが無効化されるだけで害はない。
   *
   * @param {string} filename 保存ファイル名
   * @param {Blob|string} data 保存内容
   * @param {string} mime data が文字列のときの MIME タイプ
   * @returns {boolean} 発火できたか
   */
  function triggerBrowserDownload(filename, data, mime){
    try {
      var blob = data instanceof Blob ? data : new Blob([data], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch (err) {
      return false;
    }
  }

  /**
   * data:image/png;base64,... 形式の文字列を同期的に Blob へ変換します。
   *
   * @param {string} dataUrl data URL 文字列
   * @returns {Blob}
   */
  function dataUrlToBlobSync(dataUrl){
    var parts = dataUrl.split(",");
    var mimeMatch = parts[0].match(/:(.*?);/);
    var mime = mimeMatch ? mimeMatch[1] : "image/png";
    var binary = atob(parts[1]);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new Blob([bytes], { type: mime });
  }

  // ---------- export: png ----------
  function loadImageAsync(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  function drawImageCover(ctx, img, x, y, w, h){
    var ir = img.width / img.height;
    var tr = w / h;
    var sx, sy, sw, sh;
    if (ir > tr) {
      sh = img.height;
      sw = sh * tr;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / tr;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function roundedRectPath(ctx, x, y, w, h, r){
    var rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  async function renderExportCanvas(menu){
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (e) { /* ignore */ }
    }
    var canvas = document.createElement("canvas");
    canvas.width = menu.width;
    canvas.height = menu.height;
    var ctx = canvas.getContext("2d");

    if (menu.bgImage) {
      try {
        var bgImg = await loadImageAsync(menu.bgImage);
        drawImageCover(ctx, bgImg, 0, 0, menu.width, menu.height);
      } catch (e) {
        ctx.fillStyle = menu.bgColor;
        ctx.fillRect(0, 0, menu.width, menu.height);
      }
    } else {
      ctx.fillStyle = menu.bgColor;
      ctx.fillRect(0, 0, menu.width, menu.height);
    }

    for (var i = 0; i < menu.areas.length; i += 1) {
      var a = menu.areas[i];
      var radius = a.radius || 0;

      if (a.border === "shadow" && !a.transparent && !a.image) {
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.35)";
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 10;
        roundedRectPath(ctx, a.x, a.y, a.w, a.h, radius);
        ctx.fillStyle = a.bgColor;
        ctx.fill();
        ctx.restore();
      }

      if (a.image) {
        var img = null;
        try { img = await loadImageAsync(a.image); } catch (e) { img = null; }
        ctx.save();
        roundedRectPath(ctx, a.x, a.y, a.w, a.h, radius);
        ctx.clip();
        if (img) {
          drawImageCover(ctx, img, a.x, a.y, a.w, a.h);
        } else if (!a.transparent) {
          ctx.fillStyle = a.bgColor;
          ctx.fillRect(a.x, a.y, a.w, a.h);
        }
        ctx.restore();
      } else if (!a.transparent && a.border !== "shadow") {
        roundedRectPath(ctx, a.x, a.y, a.w, a.h, radius);
        ctx.fillStyle = a.bgColor;
        ctx.fill();
      }

      if (a.border === "line") {
        roundedRectPath(ctx, a.x + 2, a.y + 2, Math.max(0, a.w - 4), Math.max(0, a.h - 4), Math.max(0, radius - 2));
        ctx.strokeStyle = (a.transparent || a.image) ? a.bgColor : "rgba(255,255,255,0.35)";
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = a.textColor;
      var fontSize = a.fontSize ? a.fontSize : Math.max(24, Math.min(64, a.h * 0.14));
      var weight = fontWeightCss(a.fontWeight);
      var cx = a.x + a.w / 2;
      var cy = a.y + a.h / 2;

      if (a.textShadow) {
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
      }

      if (a.icon) {
        ctx.font = Math.round(fontSize * 1.7) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.fillText(a.icon, cx, cy - fontSize * 0.55);
        ctx.font = weight + " " + Math.round(fontSize) + 'px Archivo, sans-serif';
        ctx.fillText(a.label || "", cx, cy + fontSize * 0.75);
      } else {
        ctx.font = weight + " " + Math.round(fontSize) + 'px Archivo, sans-serif';
        ctx.fillText(a.label || "", cx, cy);
      }

      if (a.textShadow) { ctx.restore(); }
    }

    return canvas;
  }

  async function exportPng(){
    el.exportPngBtn.disabled = true;
    try {
      var menu = activeMenu();
      var canvas = await renderExportCanvas(menu);
      var dataUrl = canvas.toDataURL("image/png");
      el.pngPreviewImg.src = dataUrl;
      el.pngPreview.classList.add("is-visible");

      if (downloadsApi) {
        try {
          var blob = await (await fetch(dataUrl)).blob();
          await downloadsApi.save({ filename: sanitizeFilename(menu.name) + ".png", data: blob });
          el.pngPreviewHint.textContent = "保存しました。長押し/右クリックでも保存できます。";
          showToast("PNG を保存しました");
        } catch (err) {
          el.pngPreviewHint.textContent = "自動保存に失敗したため、下の画像を長押し/右クリックして保存してください。";
          showToast(downloadErrorMessage(err), "error");
        }
      } else if (triggerBrowserDownload(sanitizeFilename(menu.name) + ".png", dataUrlToBlobSync(dataUrl), "image/png")) {
        el.pngPreviewHint.textContent = "ダウンロードしました。長押し/右クリックでも保存できます。";
        showToast("PNG をダウンロードしました");
      } else {
        el.pngPreviewHint.textContent = "この環境では自動保存できません。下の画像を長押し/右クリックして保存してください。";
      }
    } finally {
      el.exportPngBtn.disabled = false;
    }
  }

  // ---------- static UI: grid presets ----------
  var GRID_PRESETS = [
    { rows: 1, cols: 1, label: "全面 1つ" },
    { rows: 1, cols: 2, label: "1×2" },
    { rows: 2, cols: 2, label: "2×2" },
    { rows: 2, cols: 3, label: "2×3" },
    { rows: 3, cols: 2, label: "3×2" },
    { rows: 1, cols: 3, label: "1×3" }
  ];

  function renderGridPresetButtons(){
    el.gridPresets.innerHTML = "";
    GRID_PRESETS.forEach(function(p){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "grid-btn";
      var swatch = document.createElement("div");
      swatch.className = "grid-swatch";
      swatch.style.gridTemplateColumns = "repeat(" + p.cols + ",1fr)";
      swatch.style.gridTemplateRows = "repeat(" + p.rows + ",1fr)";
      for (var i = 0; i < p.rows * p.cols; i += 1) {
        var cell = document.createElement("span");
        swatch.appendChild(cell);
      }
      btn.appendChild(swatch);
      var text = document.createElement("span");
      text.textContent = p.label;
      btn.appendChild(text);
      btn.addEventListener("click", function(rows, cols){
        return function(){ generateGrid(rows, cols); };
      }(p.rows, p.cols));
      el.gridPresets.appendChild(btn);
    });
  }

  // ---------- wire static events ----------
  el.sizePreset.addEventListener("change", function(){ applySizePreset(this.value); });
  el.canvas.addEventListener("pointerdown", onCanvasPointerDown);
  el.canvas.addEventListener("pointermove", onCanvasPointerMove);
  el.canvas.addEventListener("pointerup", onCanvasPointerUp);
  el.canvas.addEventListener("pointercancel", onCanvasPointerUp);

  el.addMenuBtn.addEventListener("click", addMenu);

  el.bgColor.addEventListener("input", function(){ activeMenu().bgColor = this.value; renderCanvas(); });
  el.bgImageInput.addEventListener("change", async function(){
    var file = this.files && this.files[0];
    if (!file) return;
    activeMenu().bgImage = await readImageAsDataUrl(file);
    render();
  });
  el.clearBgImage.addEventListener("click", function(){
    activeMenu().bgImage = null;
    el.bgImageInput.value = "";
    render();
  });

  el.menuName.addEventListener("input", function(){ activeMenu().name = this.value; renderTabs(); renderJsonPreview(); });
  el.menuAlias.addEventListener("input", function(){ activeMenu().alias = this.value; renderJsonPreview(); });
  el.chatBarText.addEventListener("input", function(){ activeMenu().chatBarText = this.value; renderToolbox(); renderJsonPreview(); });

  el.addAreaBtn.addEventListener("click", addManualArea);
  el.copyJsonBtn.addEventListener("click", copyJsonToClipboard);
  el.downloadJsonBtn.addEventListener("click", downloadJson);
  el.exportPngBtn.addEventListener("click", exportPng);

  // ---------- init ----------
  renderGridPresetButtons();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function(api){
      downloadsApi = api;
    });
  }
})();
</script>
